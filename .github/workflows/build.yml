name: Compilar OtimizadorPC (Windows .exe)

# Compila o executavel do Otimizador PC numa maquina Windows real do GitHub.
# O .exe gerado fica disponivel para download como "artifact" ao final da
# execucao (aba Actions -> abra a run -> secao Artifacts).
#
# Dispara:
#   * em todo push para main ou para os branches claude/** ;
#   * manualmente pelo botao "Run workflow" (workflow_dispatch) ;
#   * em tags v* -> alem do artifact, publica uma Release com o .exe anexado.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publicar um release com esta tag (ex.: v1.1.0). Deixe vazio para só compilar."
        required: false
        default: ""
      target:
        description: "Branch/commit alvo da tag do release."
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (.exe) no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar com o PyInstaller
        run: pyinstaller --noconfirm --clean OtimizadorPC.spec

      - name: Conferir se o .exe foi gerado
        shell: pwsh
        run: |
          $exe = "dist/OtimizadorPC.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "O executavel nao foi gerado em $exe"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: $exe gerado com sucesso ($mb MB)."

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $ver = (python -c "import config; print(config.VERSAO_APP)").Trim()
          Write-Host "Compilando instalador para a versao $ver ..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "instalador\OtimizadorPC.iss"
          $setup = "dist/OtimizadorPC-Setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "O instalador nao foi gerado em $setup"
            exit 1
          }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "OK: $setup gerado com sucesso ($mb MB)."

      - name: Publicar os artifacts (download)
        uses: actions/upload-artifact@v4
        with:
          name: OtimizadorPC-windows
          path: |
            dist/OtimizadorPC.exe
            dist/OtimizadorPC-Setup.exe
          if-no-files-found: error

      # Publica um Release com o .exe anexado quando:
      #   * uma tag v* e' enviada (push), OU
      #   * o workflow e' disparado manualmente com um 'tag' informado.
      # Em disparo manual, o proprio runner cria a tag (gh release create
      # --target ...), o que dispensa enviar a tag pelo git.
      - name: Publicar Release com o instalador e o .exe
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TARGET_ARG="--target ${{ github.event.inputs.target }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TARGET_ARG=""
          fi
          notes=$'📥 **Recomendado:** baixe o **OtimizadorPC-Setup.exe** (instalador) — cria atalho no Menu Iniciar e desinstalador.\nPrefere portátil? Baixe o **OtimizadorPC.exe** avulso (não precisa de Python).\n\n🆕 **Novidades**\n• 🧽 **Debloat do Windows**: remover Copilot, telemetria, widgets, Bing no Iniciar e apps pré-instalados (bloatware) — tudo reversível.\n• 📦 **Instalador profissional** (Inno Setup) e dados do usuário em %LOCALAPPDATA% (backups/desfazer funcionam mesmo instalado em Arquivos de Programas).\n• 🪟 Janela premium (tema escuro, anel de saúde, efeitos).\n\n• Para aplicar ajustes: **Executar como administrador**.\n• Prefere o terminal? Rode `OtimizadorPC.exe --cli`.\n\n🛡 Por segurança, o programa **não** desativa o Windows Defender.\n\nExecutável para Windows 10/11, compilado automaticamente pelo GitHub Actions.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/OtimizadorPC-Setup.exe" "dist/OtimizadorPC.exe" --clobber
          else
            gh release create "$TAG" "dist/OtimizadorPC-Setup.exe" "dist/OtimizadorPC.exe" $TARGET_ARG \
              --title "Otimizador PC $TAG" \
              --notes "$notes"
          fi
