name: Compilar OtimizadorPC (Windows .exe)

# Compila o executavel do Otimizador PC numa maquina Windows real do GitHub.
# O .exe gerado fica disponivel para download como "artifact" ao final da
# execucao (aba Actions -> abra a run -> secao Artifacts).
#
# Dispara:
#   * em todo push para main ou para os branches claude/** ;
#   * manualmente pelo botao "Run workflow" (workflow_dispatch) ;
#   * em tags v* -> alem do artifact, publica uma Release com o .exe anexado.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publicar um release com esta tag (ex.: v1.1.0). Deixe vazio para só compilar."
        required: false
        default: ""
      target:
        description: "Branch/commit alvo da tag do release."
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (.exe) no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar com o PyInstaller
        run: pyinstaller --noconfirm --clean OtimizadorPC.spec

      - name: Conferir se o .exe foi gerado
        shell: pwsh
        run: |
          $exe = "dist/OtimizadorPC.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "O executavel nao foi gerado em $exe"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: $exe gerado com sucesso ($mb MB)."

      - name: Publicar o .exe como artifact (download)
        uses: actions/upload-artifact@v4
        with:
          name: OtimizadorPC-windows
          path: dist/OtimizadorPC.exe
          if-no-files-found: error

      # Publica um Release com o .exe anexado quando:
      #   * uma tag v* e' enviada (push), OU
      #   * o workflow e' disparado manualmente com um 'tag' informado.
      # Em disparo manual, o proprio runner cria a tag (gh release create
      # --target ...), o que dispensa enviar a tag pelo git.
      - name: Publicar Release com o .exe
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TARGET_ARG="--target ${{ github.event.inputs.target }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TARGET_ARG=""
          fi
          notes=$'📥 Baixe o **OtimizadorPC.exe** na seção *Assets* abaixo — não precisa de Python instalado.\n\n🆕 **Novidade: janela premium (GUI).** O programa agora abre numa janela moderna (tema escuro, anel de saúde do PC e ações rápidas). O mesmo motor seguro de sempre, agora bonito.\n\n• Duplo-clique para abrir a **janela** (diagnóstico e recomendações funcionam sem admin).\n• Para aplicar ajustes: clique com o botão direito → **Executar como administrador**.\n• Prefere o terminal? Rode `OtimizadorPC.exe --cli`.\n\nExecutável para Windows 10/11, compilado automaticamente pelo GitHub Actions.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/OtimizadorPC.exe" --clobber
          else
            gh release create "$TAG" "dist/OtimizadorPC.exe" $TARGET_ARG \
              --title "Otimizador PC $TAG" \
              --notes "$notes"
          fi
